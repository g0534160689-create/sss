name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\DaatAharon.sln
      - name: Build
        run: dotnet build .\DaatAharon.sln -c Release --no-restore
      - name: Test
        run: dotnet test .\DaatAharon.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
