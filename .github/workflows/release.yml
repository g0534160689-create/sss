name: Windows Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore .\DaatAharon.sln
      - name: Build
        run: dotnet build .\DaatAharon.sln -c Release --no-restore
      - name: Test
        run: dotnet test .\DaatAharon.sln -c Release --no-build
      - name: Publish Windows x64
        run: dotnet publish .\src\DaatAharon.App\DaatAharon.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.version.outputs.version }} -o .\artifacts\publish
      - name: Download Microsoft WebView2 Runtime bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile ".\installer\WebView2Bootstrapper.exe"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAPP_VERSION=${{ steps.version.outputs.version }}" ".\installer\DaatAharon.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DaatAharon-Windows-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "דעת אהרן ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: artifacts/installer/*.exe
